name: Build SolarCalc LK Android APK 📱

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Generate Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend & Build Vite Web App
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Grant Executable Permissions to Gradle Wrapper
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Android APK (Debug / Standalone)
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Identification
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk SolarCalc_LK_V1.0.apk

      - name: Upload Downloadable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarCalc_LK_V1.0_Android_APK
          path: SolarCalc_LK_V1.0.apk
          retention-days: 30
