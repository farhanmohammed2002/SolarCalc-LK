name: Build SolarCalc LK Android APK 📱

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Generate Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK Components
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 platforms;android-34 build-tools;35.0.0 build-tools;34.0.0'

      - name: Install Frontend & Build Vite Web App
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Sync Web Assets to Android
        run: |
          cd frontend
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Grant Executable Permissions to Gradle Wrapper
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Android APK (Debug / Standalone)
        id: gradle_step
        continue-on-error: true
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          EXIT_CODE=$?
          echo "GRADLE_EXIT=$EXIT_CODE" >> "$GITHUB_ENV"
          cat build.log
          exit $EXIT_CODE

      - name: Publish Build Diagnostic Summary
        if: always()
        run: |
          if [ -f frontend/android/build.log ]; then
            echo "### Gradle Build Log (tail)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 60 frontend/android/build.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::group::Gradle Full Error Section"
            grep -A 15 "\* Where:" frontend/android/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -A 15 "\* What went wrong:" frontend/android/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -A 10 "Caused by:" frontend/android/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::endgroup::"
          fi
          if [ "${{ steps.gradle_step.outcome }}" != "success" ]; then
            echo "Gradle failed with outcome ${{ steps.gradle_step.outcome }}"
            exit 1
          fi

      - name: Locate & Rename APK
        run: |
          echo "Scanning for APK outputs..."
          find frontend/android -name "*.apk"
          APK_PATH=$(find frontend/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find frontend/android -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file was not found."
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" SolarCalc_LK_V1.0.apk
          ls -lh SolarCalc_LK_V1.0.apk

      - name: Upload Downloadable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarCalc_LK_V1.0_Android_APK
          path: SolarCalc_LK_V1.0.apk
          retention-days: 30
