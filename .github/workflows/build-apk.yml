name: Build SolarCalc LK Android APK 📱

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Generate Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK Components
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install Frontend & Build Vite Web App
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Sync Web Assets to Android
        run: |
          cd frontend
          npx cap copy android || cp -r dist/* android/app/src/main/assets/public/

      - name: Grant Executable Permissions to Gradle Wrapper
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Android APK (Debug / Standalone)
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || (echo "=== GRADLE FAILURE LOG ===" && grep -C 5 -i -E "(error|exception|failed|failure)" build.log | head -n 100 && exit 1)

      - name: Locate & Rename APK
        run: |
          APK_PATH=$(find frontend/android -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" SolarCalc_LK_V1.0.apk
          ls -lh SolarCalc_LK_V1.0.apk

      - name: Upload Downloadable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarCalc_LK_V1.0_Android_APK
          path: SolarCalc_LK_V1.0.apk
          retention-days: 30
